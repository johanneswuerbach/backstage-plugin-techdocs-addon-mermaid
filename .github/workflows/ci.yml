name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]

    name: Test ${{ matrix.node-version }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - run: yarn install --immutable
    - run: yarn tsc:full
    - run: yarn build
    - run: yarn test

  e2e:
    runs-on: ubuntu-latest

    name: TechDocs preview e2e

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: yarn
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: preview-app/e2e/requirements.txt
    - run: pip install -r preview-app/e2e/requirements.txt
    - run: yarn install --immutable
    - run: yarn workspace techdocs-mermaid-preview-app build
    - run: yarn workspace techdocs-mermaid-preview-app test:e2e
